name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/r1-robomath
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.13.6
      - run: uv sync --locked --dev
      - run: uv run --locked pytest -q

  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.13.6
      - run: ./scripts/py.sh sync --locked --project daily
      - run: ./scripts/py.sh run --locked --project daily python scripts/check_daily.py

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake g++
      - run: cmake -S projects/r3-minilinalg -B build/r3 -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/r3 -j
      - run: ctest --test-dir build/r3 --output-on-failure
